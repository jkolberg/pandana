name: Unit tests

# This workflow runs the Pandana unit tests in a single generic environment (recent but
# stable Python version on recent but stable Ubuntu). The cross-compatibility.yml
# workflow runs the same tests across multiple platforms.

on:
  push:
  # pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        pandas-version: ['2.3.*', 'latest']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Pandana
      run: |
        pip install .
        if [ "${{ matrix.pandas-version }}" = "latest" ]; then pip install -U pandas; else pip install "pandas==${{ matrix.pandas-version }}"; fi
        pip install osmnet
    - name: Run unit tests
      run: |
        pip install pytest
        pytest -s
